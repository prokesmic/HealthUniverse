  <text x="92" y="114" fill="#8a8278" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="4">HEALTH UNIVERSE</text>
  <text x="92" y="214" fill="#2a2520" font-family="Fraunces, Georgia, serif" font-size="74">The living map of</text>
