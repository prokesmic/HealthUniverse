    <ellipse rx="172" ry="82" fill="none" stroke="url(#ring)" stroke-width="1" transform="rotate(54)"/>
    <circle cx="-64" cy="-38" r="4" fill="#c9a961"/>
    <circle cx="-18" cy="-76" r="3" fill="#c9a961"/>
    <circle cx="44" cy="-52" r="4" fill="#c9a961"/>
