      <stop offset="0%" stop-color="#fcf8ed"/>
      <stop offset="100%" stop-color="#f1e6cf"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ead7a5"/>
      <stop offset="100%" stop-color="#c9a961"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="546" rx="36" fill="#fffdf6" stroke="#e7decb" stroke-width="2"/>
  <g transform="translate(854 314)">
