<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Health Universe{% endblock %}</title>
{% block og %}
<meta property="og:site_name" content="Health Universe">
<meta property="og:type" content="website">
<meta property="og:title" content="Health Universe">
<meta property="og:description" content="A living map of nutrition, lifestyle, supplements, and disease risk.">
{% endblock %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="topnav" role="banner">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="44" height="44">
        <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <circle cx="24" cy="24" r="8"  fill="none" stroke="currentColor" stroke-width="0.8"/>
        {% for a in [0,30,60,90,120,150] %}
        <line x1="24" y1="4" x2="24" y2="44" stroke="currentColor" stroke-width="0.5"
              transform="rotate({{a}} 24 24)"/>
        {% endfor %}
      </svg>
    </span>
    <span class="brand-text"><b>HEALTH</b><br/>UNIVERSE</span>
  </a>
  <nav class="topnav-links" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/discoveries">Discoveries</a>
    <a href="/tier/A">Evidence</a>
    <a href="/explore">Graph</a>
    <a href="/myths">Myths</a>
    <a href="/me">My stack</a>
  </nav>
  <form class="topnav-search" method="get" action="/search">
    <label class="sr-only" for="site-search-query">Site search</label>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="site-search-query" name="q" placeholder="Search evidence, topics, conditions…" aria-label="Site search" />
    <kbd>⏎</kbd>
  </form>
  <div class="topnav-actions">
    <button type="button" aria-label="Open saved evidence"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button type="button" aria-label="Open notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></button>
    <span class="avatar">DR</span>
  </div>
</header>

<main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>

<footer class="footer">
  <span>Health Universe — not medical advice. Consult a clinician.</span>
</footer>
</body>
</html>
